name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Required status check for branch protection (see repo settings). Runs on
  # every PR into master and on every push to master.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - run: flutter pub get

      # --no-fatal-infos: don't fail the build on info-level findings (e.g.
      # a newly-deprecated API in a Flutter SDK bump) — those 6 already
      # slipped through once and broke this job for nothing actually wrong.
      # Warnings and errors (--fatal-warnings, the default) still fail it.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # Validates the web build doesn't break; doesn't deploy anything.
      - run: flutter build web --release --base-href /pokemon/

  # Push-to-master only. Rebuilds (this job doesn't reuse the `test` job's
  # build artifact — see the CI/CD summary for why) and publishes a new,
  # SHA-named release directory on VM2, then atomically flips the
  # /var/www/pokemon-releases/current symlink to it.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - run: flutter pub get

      # --base-href /pokemon/ : l'app est servie depuis lauper-dev.ch/pokemon/,
      # pas depuis la racine du domaine. Sans ce flag, index.html référence
      # les assets (flutter_bootstrap.js, manifest.json, etc.) avec des
      # chemins absolus partant de "/", ce qui donne des 404 en prod même si
      # tout semble correct en local.
      - run: flutter build web --release --base-href /pokemon/

      - name: Upload build to a new release directory on VM2
        uses: burnett01/rsync-deployments@v9
        with:
          switches: "-avz"
          path: "build/web/"
          remote_path: "/var/www/pokemon-releases/${{ github.sha }}/"
          remote_host: ${{ secrets.VM2_HOST }}
          remote_user: ${{ secrets.VM2_DEPLOY_USER }}
          remote_key: ${{ secrets.VM2_DEPLOY_SSH_KEY }}

      # /var/www/pokemon-releases/current (pas /var/www/pokemon) : deploy-client
      # est propriétaire de tout /var/www/pokemon-releases/, mais pas de
      # /var/www/ lui-même — créer un lien à cet endroit demanderait un droit
      # qu'il n'a pas. nginx pointe donc directement sur .../current/.
      - name: Switch the live symlink and prune old releases
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM2_HOST }}
          username: ${{ secrets.VM2_DEPLOY_USER }}
          key: ${{ secrets.VM2_DEPLOY_SSH_KEY }}
          script: |
            ln -sfn /var/www/pokemon-releases/${{ github.sha }} /var/www/pokemon-releases/current
            cd /var/www/pokemon-releases && ls -1dt */ | grep -v '^current' | tail -n +4 | xargs -r rm -rf --